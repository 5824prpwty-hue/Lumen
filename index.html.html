${c?`<p class="ch">${c.map(x=>tr(x,k)).join("  ")}</p><p class="s">Acordes de la intro. La letra completa se cargará desde tu PDF.</p>`:`<p class="s">Acordes y letra pendientes de cargar desde tu PDF.</p>`}</div>

function biblia(){m.innerHTML=`<h1>Biblia</h1><p class="s">Buscador por palabra o cita</p><input id="q" type="search" placeholder="Busca «pastor», «Juan 3»…" autocomplete="off"><div id="l"></div><p class="s">Vista previa con 3 versículos (Reina-Valera 1909). El texto completo se añadirá en la siguiente fase.</p>`;
